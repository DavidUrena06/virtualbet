<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VirtualBet — Mines</title>
  <link rel="stylesheet" href="../../css/main.css">
  <style>
    /* ══════════════════════════════════════════════════════════════
       LAYOUT — Sidebar fija + Stage del juego (Stake-style)
    ══════════════════════════════════════════════════════════════ */
    .game-shell {
      display: grid;
      grid-template-columns: 200px 1fr;
      min-height: calc(100vh - var(--navbar-h));
      background: #0f1117;
    }

    .game-sidebar {
      background: #151822;
      border-right: 1px solid #1e2130;
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .game-stage {
      background: #0f1117;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    /* ── Tipografía e inputs del sidebar ──────────────────────────── */
    .sb-label {
      font-size: 11px;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .sb-group { display: flex; flex-direction: column; }

    .sb-input-wrap { position: relative; display: flex; align-items: center; }
    .sb-input {
      width: 100%;
      background: #0f1117;
      border: 1px solid #1e2130;
      border-radius: 8px;
      color: #fff;
      font-size: 1.25rem;
      font-weight: 700;
      padding: 12px 38px 12px 14px;
      outline: none;
      font-family: inherit;
      font-variant-numeric: tabular-nums;
      transition: border-color 0.15s ease;
    }
    .sb-input:focus { border-color: #00e676; }
    .sb-input::-webkit-outer-spin-button,
    .sb-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .sb-input[type=number] { -moz-appearance: textfield; }
    .sb-input-suffix {
      position: absolute;
      right: 12px;
      font-size: 1.05rem;
      pointer-events: none;
      color: #6b7280;
    }

    .sb-quick {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 8px;
    }
    .sb-quick button {
      background: #1e2130;
      border: none;
      color: #cbd5e1;
      font-weight: 600;
      font-size: 0.78rem;
      padding: 8px 0;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.5px;
      transition: all 0.15s ease;
    }
    .sb-quick button:hover { background: #2a2f42; color: #fff; }

    /* ── Selector de cantidad de minas ────────────────────────────── */
    .mines-selector {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .mines-opt {
      background: #1e2130;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 9px 0;
      text-align: center;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 700;
      color: #cbd5e1;
      transition: all 0.15s ease;
      user-select: none;
    }
    .mines-opt:hover { background: #2a2f42; }
    .mines-opt.selected {
      background: rgba(0,230,118,0.12);
      border-color: #00e676;
      color: #00e676;
    }

    /* ── Botón principal — pegado al fondo del sidebar ──────────── */
    .sb-action { margin-top: auto; }
    .btn-play {
      width: 100%;
      background: #00e676;
      color: #000;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.5px;
      transition: all 0.15s ease;
    }
    .btn-play:hover:not(:disabled) {
      background: #00ff88;
      box-shadow: 0 4px 16px rgba(0,230,118,0.3);
    }
    .btn-play:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Multiplier display del stage ─────────────────────────────── */
    .mult-display {
      text-align: center;
      padding: 18px 32px;
      background: #151822;
      border: 1px solid #1e2130;
      border-radius: 12px;
      min-width: 320px;
    }
    .mult-display .mult-value {
      font-size: 3rem;
      font-weight: 800;
      color: #00e676;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      transition: color 0.2s ease;
    }
    .mult-display .mult-label {
      font-size: 0.7rem;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 6px;
    }
    .mult-display .payout-line {
      font-size: 0.9rem;
      color: #cbd5e1;
      margin-top: 8px;
    }
    .mult-display .payout-line strong { color: #00e676; }

    /* ── Tablero 5×5 ──────────────────────────────────────────────── */
    .mines-board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      width: 100%;
      min-width: 380px;
      max-width: 560px;
      aspect-ratio: 1;
      min-height: 480px;
    }
    .mine-cell {
      aspect-ratio: 1;
      border-radius: 12px;
      background: #1a1f2e;
      border: 1px solid #1e2130;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
      user-select: none;
      position: relative;
    }
    .mine-cell:hover:not(.revealed-safe):not(.revealed-mine):not(.disabled) {
      background: #232a3d;
      border-color: #00e676;
      transform: scale(1.04);
    }
    .mine-cell.revealed-safe {
      background: #0d2318;
      border-color: #00e676;
      cursor: default;
      animation: gemReveal 0.32s ease;
    }
    .mine-cell.revealed-mine {
      background: #2a0d0d;
      border-color: #ef4444;
      cursor: default;
      animation: mineShake 0.5s cubic-bezier(.36,.07,.19,.97);
    }
    .mine-cell.disabled { cursor: default; opacity: 0.55; }
    .mine-cell.hint {
      background: rgba(239,68,68,0.06);
      border-color: rgba(239,68,68,0.25);
      opacity: 0.55;
    }

    @keyframes gemReveal {
      0%   { transform: scale(0.7); opacity: 0.3; }
      60%  { transform: scale(1.12); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes mineShake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
      40%, 60% { transform: translate3d(5px, 0, 0); }
    }

    /* ══════════════════════════════════════════════════════════════
       MOBILE — Stack vertical: juego arriba, controles abajo
    ══════════════════════════════════════════════════════════════ */
    @media (max-width: 768px) {
      .game-shell {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr auto;
      }
      .game-sidebar {
        order: 2;
        border-right: none;
        border-top: 1px solid #1e2130;
        padding: 18px 16px;
      }
      .game-stage {
        order: 1;
        padding: 14px 10px;
      }
      .mines-board { min-width: 0; max-width: 380px; min-height: 0; }
      .mine-cell { font-size: 2rem; }
      .sb-action { margin-top: 12px; }
      .mult-display { padding: 14px 20px; min-width: 0; width: 100%; max-width: 380px; }
      .mult-display .mult-value { font-size: 2.2rem; }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="./dashboard.html" class="navbar__logo">🎰 VirtualBet</a>
  <div class="navbar__nav"></div>
  <div class="navbar__balance">🪙 <span id="navBalance">—</span></div>
</nav>

<div class="game-shell">

  <!-- ────────── Sidebar de controles ────────── -->
  <aside class="game-sidebar">

    <!-- Cantidad de minas -->
    <div class="sb-group" id="minesControl">
      <div class="sb-label">Cantidad de minas</div>
      <div class="mines-selector">
        <div class="mines-opt selected" onclick="setMines(1)">1</div>
        <div class="mines-opt" onclick="setMines(3)">3</div>
        <div class="mines-opt" onclick="setMines(5)">5</div>
        <div class="mines-opt" onclick="setMines(10)">10</div>
        <div class="mines-opt" onclick="setMines(20)">20</div>
      </div>
      <div style="font-size:11px;color:#6b7280;margin-top:8px;letter-spacing:0.3px;">
        Inicial 1 celda: <strong style="color:#ffb020;" id="firstMultHint">—</strong>
      </div>
    </div>

    <!-- Apuesta -->
    <div class="sb-group" id="betControl">
      <div class="sb-label">Apuesta</div>
      <div class="sb-input-wrap">
        <input class="sb-input" type="number" id="betAmount"
               min="1" value="10" step="1" oninput="updateHint()">
        <span class="sb-input-suffix">🪙</span>
      </div>
      <div class="sb-quick">
        <button onclick="setBet(10)">10</button>
        <button onclick="setBet(50)">50</button>
        <button onclick="setBet(100)">100</button>
        <button onclick="setMaxBet()">MAX</button>
      </div>
    </div>

    <!-- Botón principal — pegado al fondo -->
    <div class="sb-action" id="actionArea">
      <button class="btn-play" onclick="startGame()">
        💣 Jugar
      </button>
    </div>
  </aside>

  <!-- ────────── Stage del juego ────────── -->
  <section class="game-stage">

    <!-- Multiplicador actual -->
    <div class="mult-display">
      <div class="mult-value" id="multDisplay">—</div>
      <div class="mult-label" id="multLabel">Ganancia potencial</div>
      <div class="payout-line">
        Ganás: <strong id="payoutDisplay">0.00 🪙</strong>
      </div>
    </div>

    <!-- Tablero 5×5 -->
    <div class="mines-board" id="board"></div>
  </section>
</div>

<script src="../../js/api.js"></script>
<script src="../js/navbar.js"></script>
<script>
  requireLogin();

  let gameId     = null;
  let minesCount = 1;
  let betAmt     = 10;
  let revealed   = [];
  let currentBalance = 0;
  let playing    = false;
  const HOUSE_EDGE = 0.03;
  const TOTAL_CELLS = 25;

  // ── Carga balance ─────────────────────────────────────────────────────────
  async function loadBalance() {
    try {
      const d = await VB.wallet.balance();
      currentBalance = parseFloat(d.wallet.balance);
      document.getElementById('navBalance').textContent =
        currentBalance.toLocaleString('es-CR', { minimumFractionDigits: 2 });
    } catch(e) {}
  }

  function setMines(n) {
    minesCount = n;
    document.querySelectorAll('.mines-opt').forEach(el => {
      el.classList.toggle('selected', parseInt(el.textContent) === n);
    });
    updateHint();
  }

  function setBet(n) {
    document.getElementById('betAmount').value = n;
    betAmt = n;
    updateHint();
  }
  function setHalfBet() {
    const c = parseFloat(document.getElementById('betAmount').value) || 10;
    setBet(Math.max(1, Math.floor(c / 2)));
  }
  function setMaxBet() { setBet(Math.max(1, Math.floor(currentBalance))); }

  // Calcula multiplicador esperado con X reveals
  function calcMult(reveals) {
    let m = 1;
    const safe = TOTAL_CELLS - minesCount;
    for (let i = 0; i < reveals; i++) {
      m *= (TOTAL_CELLS - i) / (safe - i);
    }
    return m * (1 - HOUSE_EDGE);
  }

  function updateHint() {
    betAmt = parseFloat(document.getElementById('betAmount').value) || 10;
    const m = calcMult(1);
    document.getElementById('firstMultHint').textContent = m.toFixed(4) + 'x';
    if (!playing) {
      document.getElementById('multDisplay').textContent = '—';
      document.getElementById('payoutDisplay').textContent = '0.00 🪙';
    }
  }

  // ── Crea el tablero inicial ───────────────────────────────────────────────
  function buildBoard(disabled = false) {
    const board = document.getElementById('board');
    board.innerHTML = '';
    for (let i = 0; i < 25; i++) {
      const cell = document.createElement('div');
      cell.className = 'mine-cell' + (disabled ? ' disabled' : '');
      cell.dataset.index = i;
      // Celdas arrancan vacías; solo muestran 💎/💣 al revelarse
      cell.textContent = '';
      if (!disabled) cell.onclick = () => clickCell(i);
      board.appendChild(cell);
    }
  }

  // ── Inicia el juego ───────────────────────────────────────────────────────
  async function startGame() {
    betAmt = parseFloat(document.getElementById('betAmount').value);

    if (!betAmt || betAmt < 1) { showToast('Apuesta mínima: 1 moneda', 'error'); return; }
    if (betAmt > currentBalance)  { showToast('Saldo insuficiente', 'error'); return; }

    try {
      const data = await VB.games.minesStart({ betAmount: betAmt, minesCount });
      gameId   = data.gameId;
      revealed = [];
      playing  = true;

      buildBoard(false);
      updateHint();

      // Desactiva controles de configuración
      document.getElementById('minesControl').style.opacity = '0.4';
      document.getElementById('minesControl').style.pointerEvents = 'none';
      document.getElementById('betControl').style.opacity = '0.4';
      document.getElementById('betControl').style.pointerEvents = 'none';

      // Muestra botón de cashout
      document.getElementById('actionArea').innerHTML = `
        <button class="btn-play" onclick="cashout()" id="cashoutBtn" disabled>
          💸 Cobrar (destapá ≥1)
        </button>
      `;

      currentBalance = data.newBalance;
      document.getElementById('navBalance').textContent =
        currentBalance.toLocaleString('es-CR', { minimumFractionDigits: 2 });

      document.getElementById('multLabel').textContent = 'Destapá celdas para ganar';

    } catch(err) {
      showToast(err.message, 'error');
    }
  }

  // ── Clic en una celda ─────────────────────────────────────────────────────
  async function clickCell(index) {
    if (!playing || !gameId) return;
    if (revealed.includes(index)) return;

    const cell = document.querySelector(`[data-index="${index}"]`);
    cell.style.pointerEvents = 'none';

    try {
      const data = await VB.games.minesReveal({ gameId, cellIndex: index });

      if (data.result === 'MINE') {
        // Explotó
        cell.className = 'mine-cell revealed-mine';
        cell.textContent = '💣';

        // Muestra todas las minas
        data.mines.forEach(mi => {
          const mc = document.querySelector(`[data-index="${mi}"]`);
          if (mc) {
            mc.className = 'mine-cell revealed-mine disabled';
            mc.textContent = '💣';
            mc.style.pointerEvents = 'none';
          }
        });

        // Las celdas seguras reveladas quedan como están
        data.revealed.forEach(ri => {
          const rc = document.querySelector(`[data-index="${ri}"]`);
          if (rc) rc.className = 'mine-cell revealed-safe disabled';
        });

        document.getElementById('multDisplay').textContent = 'BOOM!';
        document.getElementById('multDisplay').style.color = '#ef4444';
        document.getElementById('multLabel').textContent =
          `Perdiste ${betAmt.toFixed(2)} 🪙`;
        document.getElementById('payoutDisplay').textContent = '0.00 🪙';

        showToast(`💣 ¡Mina! Perdiste ${betAmt.toFixed(2)} monedas`, 'error');
        endGame(false);

      } else {
        // Celda segura
        cell.className = 'mine-cell revealed-safe disabled';
        cell.textContent = '💎';
        revealed = data.revealed;

        const mult   = data.multiplier;
        const payout = data.currentPayout;

        document.getElementById('multDisplay').textContent = mult.toFixed(4) + 'x';
        document.getElementById('multDisplay').style.color = '#00e676';
        document.getElementById('multLabel').textContent =
          `${revealed.length} celda${revealed.length > 1 ? 's' : ''} destapada${revealed.length > 1 ? 's' : ''}`;
        document.getElementById('payoutDisplay').textContent = payout.toFixed(2) + ' 🪙';

        // Habilita cashout
        const btn = document.getElementById('cashoutBtn');
        if (btn) {
          btn.disabled = false;
          btn.textContent = `💸 Cobrar ${payout.toFixed(2)} 🪙`;
        }
      }
    } catch(err) {
      showToast(err.message, 'error');
      cell.style.pointerEvents = 'auto';
    }
  }

  // ── Cashout ───────────────────────────────────────────────────────────────
  async function cashout() {
    if (!gameId || !playing) return;
    try {
      const data = await VB.games.minesCashout({ gameId });

      // Revela dónde estaban las minas
      data.mines.forEach(mi => {
        const mc = document.querySelector(`[data-index="${mi}"]`);
        if (mc && !mc.classList.contains('revealed-safe')) {
          mc.className = 'mine-cell hint disabled';
          mc.textContent = '💣';
          mc.style.pointerEvents = 'none';
        }
      });

      document.getElementById('multDisplay').textContent =
        data.multiplier.toFixed(4) + 'x';
      document.getElementById('payoutDisplay').textContent =
        data.payout.toFixed(2) + ' 🪙';

      currentBalance = data.newBalance;
      document.getElementById('navBalance').textContent =
        currentBalance.toLocaleString('es-CR', { minimumFractionDigits: 2 });

      showToast(`¡Cobrado! +${data.payout.toFixed(2)} 🪙 🎉`, 'success');
      endGame(true);

    } catch(err) {
      showToast(err.message, 'error');
    }
  }

  // ── Resetea UI después del juego ─────────────────────────────────────────
  function endGame(won) {
    playing = false;
    gameId  = null;
    revealed = [];

    // Deshabilita todas las celdas
    document.querySelectorAll('.mine-cell').forEach(c => {
      c.style.pointerEvents = 'none';
    });

    setTimeout(() => {
      buildBoard(false);
      document.getElementById('minesControl').style.opacity = '1';
      document.getElementById('minesControl').style.pointerEvents = 'auto';
      document.getElementById('betControl').style.opacity = '1';
      document.getElementById('betControl').style.pointerEvents = 'auto';
      document.getElementById('multDisplay').textContent = '—';
      document.getElementById('multDisplay').style.color = '#00e676';
      document.getElementById('multLabel').textContent = 'Ganancia potencial';
      document.getElementById('payoutDisplay').textContent = '0.00 🪙';
      document.getElementById('actionArea').innerHTML = `
        <button class="btn-play" onclick="startGame()">
          💣 Jugar
        </button>
      `;
      updateHint();
    }, 2500);
  }

  // Agrega métodos al objeto VB para los nuevos endpoints
  VB.games.minesStart   = (data) => api.post('/games/mines/start',   data);
  VB.games.minesReveal  = (data) => api.post('/games/mines/reveal',  data);
  VB.games.minesCashout = (data) => api.post('/games/mines/cashout', data);

  loadBalance();
  buildBoard(false);
  updateHint();
</script>
</body>
</html>
