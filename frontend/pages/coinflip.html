<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VirtualBet — Coinflip</title>
  <link rel="stylesheet" href="../../css/main.css">
  <style>
    /* ══════════════════════════════════════════════════════════════
       LAYOUT
    ══════════════════════════════════════════════════════════════ */
    .game-shell {
      display: grid;
      grid-template-columns: 200px 1fr;
      min-height: calc(100vh - var(--navbar-h));
      background: #0f1117;
    }
    .game-sidebar {
      background: #151822;
      border-right: 1px solid #1e2130;
      padding: 20px 14px;
      display: flex; flex-direction: column; gap: 16px;
    }
    .game-stage {
      background: #0f1117;
      padding: 36px 24px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 48px;
      min-height: 620px;
    }

    .sb-label {
      font-size: 11px; color: #6b7280; text-transform: uppercase;
      letter-spacing: 1px; font-weight: 600; margin-bottom: 8px;
    }
    .sb-group { display: flex; flex-direction: column; }
    .sb-input-wrap { position: relative; display: flex; align-items: center; }
    .sb-input {
      width: 100%; background: #0f1117; border: 1px solid #1e2130;
      border-radius: 8px; color: #fff; font-size: 1.25rem; font-weight: 700;
      padding: 12px 38px 12px 14px; outline: none; font-family: inherit;
      font-variant-numeric: tabular-nums; transition: border-color 0.15s ease;
    }
    .sb-input:focus { border-color: #00e676; }
    .sb-input::-webkit-outer-spin-button,
    .sb-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .sb-input[type=number] { -moz-appearance: textfield; }
    .sb-input-suffix {
      position: absolute; right: 12px; font-size: 1.05rem;
      pointer-events: none; color: #6b7280;
    }
    .sb-quick {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 6px; margin-top: 8px;
    }
    .sb-quick button {
      background: #1e2130; border: none; color: #cbd5e1;
      font-weight: 600; font-size: 0.78rem; padding: 8px 0;
      border-radius: 6px; cursor: pointer; font-family: inherit;
      letter-spacing: 0.5px; transition: all 0.15s ease;
    }
    .sb-quick button:hover { background: #2a2f42; color: #fff; }

    .sb-action { margin-top: auto; }
    .btn-play {
      width: 100%; background: #00e676; color: #000;
      font-weight: 600; font-size: 0.95rem; padding: 14px;
      border: none; border-radius: 8px; cursor: pointer;
      font-family: inherit; letter-spacing: 0.5px;
      transition: all 0.15s ease;
    }
    .btn-play:hover:not(:disabled) {
      background: #00ff88; box-shadow: 0 4px 16px rgba(0,230,118,0.3);
    }
    .btn-play:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Choice cards ─────────────────────────────────────────────── */
    .choice-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .choice-card {
      background: #1e2130; border: 1px solid transparent;
      border-radius: 10px; padding: 14px 6px;
      text-align: center; cursor: pointer;
      transition: all 0.15s ease;
    }
    .choice-card:hover { background: #2a2f42; }
    .choice-card.selected {
      background: rgba(0,230,118,0.12);
      border-color: #00e676;
    }
    .choice-card .choice-emoji {
      font-size: 1.6rem; display: block; margin-bottom: 4px;
    }
    .choice-card .choice-label {
      font-weight: 700; font-size: 0.8rem; letter-spacing: 1px;
      color: #cbd5e1;
    }
    .choice-card.selected .choice-label { color: #00e676; }
    .choice-card .choice-odd {
      font-size: 0.7rem; color: #6b7280; margin-top: 2px;
    }

    /* ══════════════════════════════════════════════════════════════
       COIN STAGE
    ══════════════════════════════════════════════════════════════ */
    .coin-scene {
      perspective: 1000px;
      width: 400px; height: 400px;
    }
    .coin {
      width: 400px; height: 400px;
      position: relative; transform-style: preserve-3d;
      transition: transform 0.1s ease;
    }
    .coin.flipping { animation: coinFlip 1.2s ease-out forwards; }
    @keyframes coinFlip {
      0%   { transform: rotateY(0deg) rotateX(0deg); }
      20%  { transform: rotateY(720deg) rotateX(15deg); }
      50%  { transform: rotateY(1440deg) rotateX(-10deg); }
      80%  { transform: rotateY(2160deg) rotateX(5deg); }
      100% { transform: rotateY(var(--final-rot, 2160deg)) rotateX(0deg); }
    }
    .coin__face {
      position: absolute; width: 400px; height: 400px;
      border-radius: 50%; display: flex;
      align-items: center; justify-content: center;
      font-size: 10rem; backface-visibility: hidden;
      border: 8px solid rgba(255,255,255,0.1);
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .coin__face--heads {
      background: radial-gradient(circle at 35% 35%, #f9d94a, #c8960c);
      color: #7a5c00;
    }
    .coin__face--tails {
      background: radial-gradient(circle at 35% 35%, #c0c0c0, #707070);
      color: #404040;
      transform: rotateY(180deg);
    }

    .result-banner {
      padding: 1.6rem 2.2rem; border-radius: 14px;
      text-align: center; min-height: 76px;
      max-width: 560px; width: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; font-weight: 700;
      transition: all 0.3s ease;
      background: #151822; border: 1px solid #1e2130;
      color: #6b7280;
    }
    .result-banner.win  {
      background: rgba(0,230,118,0.08); border-color: #00e676; color: #00e676;
    }
    .result-banner.loss {
      background: rgba(239,68,68,0.08); border-color: #ef4444; color: #ef4444;
    }
    @keyframes resultAppear {
      from { opacity: 0; transform: scale(0.9); }
      to   { opacity: 1; transform: scale(1); }
    }
    .result-banner.win, .result-banner.loss { animation: resultAppear 0.4s ease; }

    @media (max-width: 768px) {
      .game-shell { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      .game-sidebar {
        order: 2; border-right: none;
        border-top: 1px solid #1e2130; padding: 18px 16px;
      }
      .game-stage { order: 1; padding: 24px 16px; gap: 28px; min-height: 0; }
      .coin-scene, .coin { width: 230px; height: 230px; }
      .coin__face { width: 230px; height: 230px; font-size: 5.5rem; border-width: 5px; }
      .result-banner { font-size: 1rem; padding: 1.1rem 1.4rem; min-height: 60px; }
      .sb-action { margin-top: 12px; }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="./dashboard.html" class="navbar__logo">🎰 VirtualBet</a>
  <div class="navbar__nav"></div>
  <div class="navbar__balance">🪙 <span id="navBalance">—</span></div>
</nav>

<div class="game-shell">

  <!-- ────────── Sidebar ────────── -->
  <aside class="game-sidebar">

    <!-- Elección -->
    <div class="sb-group">
      <div class="sb-label">Tu elección</div>
      <div class="choice-selector">
        <div class="choice-card selected" id="cardHeads" onclick="setChoice('HEADS')">
          <span class="choice-emoji">🌟</span>
          <div class="choice-label">HEADS</div>
          <div class="choice-odd">1.96x</div>
        </div>
        <div class="choice-card" id="cardTails" onclick="setChoice('TAILS')">
          <span class="choice-emoji">🌙</span>
          <div class="choice-label">TAILS</div>
          <div class="choice-odd">1.96x</div>
        </div>
      </div>
    </div>

    <!-- Ganancia -->
    <div class="sb-group">
      <div class="sb-label">Ganancia potencial</div>
      <div style="background:#0f1117;border:1px solid #1e2130;border-radius:8px;
                  padding:12px;text-align:center;">
        <div style="font-size:1.4rem;font-weight:800;color:#00e676;
                    font-variant-numeric:tabular-nums;" id="potentialWin">
          0.00 🪙
        </div>
      </div>
    </div>

    <!-- Apuesta -->
    <div class="sb-group">
      <div class="sb-label">Apuesta</div>
      <div class="sb-input-wrap">
        <input class="sb-input" type="number" id="betAmount"
               min="1" value="10" step="1" oninput="updatePotential()">
        <span class="sb-input-suffix">🪙</span>
      </div>
      <div class="sb-quick">
        <button onclick="setBet(10)">10</button>
        <button onclick="setBet(50)">50</button>
        <button onclick="setBet(100)">100</button>
        <button onclick="setMaxBet()">MAX</button>
      </div>
    </div>

    <!-- Botón -->
    <div class="sb-action">
      <button class="btn-play" id="playBtn" onclick="playCoinflip()">
        🪙 Tirar moneda
      </button>
    </div>
  </aside>

  <!-- ────────── Stage ────────── -->
  <section class="game-stage">

    <div class="coin-scene">
      <div class="coin" id="coin">
        <div class="coin__face coin__face--heads">🌟</div>
        <div class="coin__face coin__face--tails">🌙</div>
      </div>
    </div>

    <div class="result-banner" id="resultBanner">
      Elegí un lado y apostá
    </div>
  </section>
</div>

<script src="../../js/api.js"></script>
<script src="../js/navbar.js"></script>
<script>
  requireLogin();

  let choice = 'HEADS';
  let currentBalance = 0;
  const MULTIPLIER = 1.96;

  async function loadBalance() {
    try {
      const data = await VB.wallet.balance();
      currentBalance = parseFloat(data.wallet.balance);
      document.getElementById('navBalance').textContent =
        currentBalance.toLocaleString('es-CR', { minimumFractionDigits: 2 });
    } catch(e) {}
  }

  function setChoice(c) {
    choice = c;
    document.getElementById('cardHeads').classList.toggle('selected', c === 'HEADS');
    document.getElementById('cardTails').classList.toggle('selected', c === 'TAILS');
  }

  function updatePotential() {
    const bet = parseFloat(document.getElementById('betAmount').value) || 0;
    document.getElementById('potentialWin').textContent =
      (bet * MULTIPLIER).toFixed(2) + ' 🪙';
  }

  function setBet(n) {
    document.getElementById('betAmount').value = n;
    updatePotential();
  }
  function setHalfBet() {
    const c = parseFloat(document.getElementById('betAmount').value) || 10;
    setBet(Math.max(1, Math.floor(c / 2)));
  }
  function setMaxBet() { setBet(Math.max(1, Math.floor(currentBalance))); }

  function flipCoin(resultIsHeads) {
    return new Promise(resolve => {
      const coin = document.getElementById('coin');
      const base = 2160;
      const finalRot = resultIsHeads ? base : base + 180;
      coin.style.setProperty('--final-rot', finalRot + 'deg');
      coin.className = 'coin flipping';
      setTimeout(() => {
        coin.className = 'coin';
        coin.style.transform = `rotateY(${finalRot}deg)`;
        resolve();
      }, 1250);
    });
  }

  async function playCoinflip() {
    const betAmount = parseFloat(document.getElementById('betAmount').value);
    const playBtn   = document.getElementById('playBtn');
    const banner    = document.getElementById('resultBanner');

    if (!betAmount || betAmount < 1) { showToast('Apuesta mínima: 1 moneda', 'error'); return; }
    if (betAmount > currentBalance)  { showToast('Saldo insuficiente', 'error'); return; }

    playBtn.disabled = true;
    playBtn.textContent = 'Tirando...';
    banner.className = 'result-banner';
    banner.textContent = '...';

    try {
      const data = await VB.games.coinflip({ betAmount, choice });

      await flipCoin(data.coinResult === 'HEADS');

      if (data.result === 'WIN') {
        banner.className = 'result-banner win';
        banner.innerHTML = `✓ ¡GANASTE ${data.payout.toFixed(2)} 🪙! Salió ${data.coinResult}`;
        showToast(`¡Ganaste ${data.payout.toFixed(2)} monedas! 🎉`, 'success');
      } else {
        banner.className = 'result-banner loss';
        banner.innerHTML = `✗ PERDISTE — Salió ${data.coinResult}`;
        showToast('Perdiste. ¡Mejor suerte la próxima!', 'error');
      }

      currentBalance = data.newBalance;
      document.getElementById('navBalance').textContent =
        currentBalance.toLocaleString('es-CR', { minimumFractionDigits: 2 });

    } catch(err) {
      showToast(err.message, 'error');
      banner.className = 'result-banner';
      banner.textContent = 'Elegí un lado y apostá';
    } finally {
      playBtn.disabled = false;
      playBtn.textContent = '🪙 Tirar moneda';
    }
  }

  loadBalance();
  updatePotential();
</script>
</body>
</html>
